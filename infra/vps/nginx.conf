server {
    listen 80;
    listen [::]:80;
    server_name usjunkcars.si www.usjunkcars.si dev.usjunkcars.si;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.usjunkcars.si;
    ssl_certificate /etc/letsencrypt/live/usjunkcars.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usjunkcars.si/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 308 https://usjunkcars.si$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name usjunkcars.si;
    ssl_certificate /etc/letsencrypt/live/usjunkcars.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usjunkcars.si/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
        error_page 502 504 =503 /__not_launched;
    }
    location = /__not_launched {
        internal;
        alias /srv/usjunkcars/holding/index.html;
        default_type text/html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Retry-After 3600 always;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.usjunkcars.si;
    ssl_certificate /etc/letsencrypt/live/usjunkcars.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usjunkcars.si/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    auth_basic "USJunkCars private development review";
    auth_basic_user_file /etc/usjunkcars/preview.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "private, no-store" always;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:3401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        proxy_intercept_errors on;
        error_page 502 504 =503 /__not_launched;
    }
    location = /__not_launched {
        internal;
        alias /srv/usjunkcars/holding/index.html;
        default_type text/html;
    }
}
